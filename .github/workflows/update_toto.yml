name: Update TOTO results

on:
  workflow_dispatch:

  schedule:
    # Tuesday & Friday 6:15 AM Singapore time = Mon and Thur 10:15 PM UTC
    - cron: "15 22 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TOTO results
        run: python update_toto.py --csv toto_prizes.csv

      - name: Commit updated results
        run: |
          if git diff --quiet -- toto_prizes.csv; then
            echo "No new TOTO results. Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add toto_prizes.csv
            git commit -m "Auto-update TOTO results"
            git push
          fi

      - name: Notify on success
        if: ${{ success() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.SINGAPOREPOOLS }}
        run: |
          LATEST_DRAW=$(tail -n +2 toto_prizes.csv | cut -d',' -f1 | tail -n 1)

          curl -fsS \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: SingaporePools TOTO updated" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -d "TOTO dataset updated. Current through Draw $LATEST_DRAW." \
            "$NTFY_TOPIC"

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.SINGAPOREPOOLS }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: SingaporePools updater failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "TOTO automatic update failed. Check GitHub Actions." \
            "$NTFY_TOPIC"
